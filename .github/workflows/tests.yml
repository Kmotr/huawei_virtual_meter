name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - 'fix/**'

permissions:
  contents: read

jobs:
  test:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2024.12.5'
            python: '3.13'
            requirements: requirements-test-min.txt
          - ha: '2025.4.4'
            python: '3.13'
            requirements: requirements-test-2025.txt
          - ha: '2026.10.4'
            python: '3.14'
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.3
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
